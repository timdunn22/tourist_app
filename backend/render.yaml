services:
  - type: web
    name: locallink-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_EXTERNAL_SERVICES
        value: "true"
      - key: FILE_STORAGE_TYPE
        value: local
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
