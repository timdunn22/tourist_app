services:
  # Backend API
  - type: web
    name: locallink-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: locallink-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: locallink-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://locallink-webapp.vercel.app
      - key: ADMIN_URL
        value: https://locallink-admin.vercel.app
      - key: FILE_STORAGE_TYPE
        value: local
      - key: SKIP_EXTERNAL_SERVICES
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: locallink-db
    plan: free
    databaseName: locallink
    user: locallink
    region: oregon

# Note: Redis requires a paid plan on Render
# For free tier, you can use Upstash Redis (free tier available)
